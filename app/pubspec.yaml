name: hy_match_app
description: HY-MATCH Non-invasive Blood Glucose Self-Management App with TFLite & BLE Integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.30.0
  tflite_flutter: ^0.12.1
  fl_chart: ^0.68.0
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/glucose_model.tflite
